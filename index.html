
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Guessing Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .game {
      width: 90%;
      max-width: 650px;
      text-align: center;
      background: #1e293b;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 42px;
      margin-top: 0;
    }

    .instructions {
      color: #94a3b8;
      font-size: 17px;
      line-height: 1.5;
    }

    .round {
      font-size: 18px;
      color: #60a5fa;
      font-weight: bold;
      margin: 25px 0;
    }

    #dotArea {
      width: 100%;
      height: 300px;
      background: #0f172a;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
      margin: 20px 0;
    }

    .dot {
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
    }

    #message {
      font-size: 22px;
      min-height: 30px;
      margin: 20px 0;
    }

    .guess-area {
      display: none;
      gap: 10px;
      justify-content: center;
    }

    input {
      width: 150px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 25px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }

    button:hover {
      background: #2563eb;
    }

    #startButton {
      margin-top: 20px;
      font-size: 20px;
      padding: 16px 35px;
    }

    #result {
      display: none;
    }

    .score {
      font-size: 60px;
      font-weight: bold;
      color: #22c55e;
      margin: 20px;
    }

    .answer {
      color: #94a3b8;
      font-size: 18px;
    }

    .correct {
      color: #22c55e;
    }

    .wrong {
      color: #ef4444;
    }
  </style>
</head>

<body>

  <div class="game">

    <div id="gameScreen">

      <h1>Dot Guess</h1>

      <p class="instructions">
        You'll see some dots for a very short time.<br>
        Try to remember how many there were!
      </p>

      <div class="round" id="round">
        Round 0 / 5
      </div>

      <div id="dotArea"></div>

      <div id="message">
        Press Start when you're ready.
      </div>

      <button id="startButton" onclick="startGame()">
        Start Game
      </button>

      <div class="guess-area" id="guessArea">
        <input
          id="guessInput"
          type="number"
          min="1"
          placeholder="Your guess"
        >

        <button onclick="submitGuess()">
          Guess
        </button>
      </div>

    </div>


    <div id="result">

      <h1>Game Over!</h1>

      <p>Your score:</p>

      <div class="score">
        <span id="finalScore">0</span> / 5
      </div>

      <p id="resultMessage"></p>

      <button onclick="restartGame()">
        Play Again
      </button>

    </div>

  </div>


  <script>

    const TOTAL_ROUNDS = 5;

    let currentRound = 0;
    let score = 0;
    let correctAnswer = 0;
    let acceptingGuess = false;


    function startGame() {

      currentRound = 0;
      score = 0;

      document.getElementById("startButton").style.display = "none";
      document.getElementById("guessArea").style.display = "none";

      nextRound();
    }


    function nextRound() {

      if (currentRound >= TOTAL_ROUNDS) {
        endGame();
        return;
      }

      currentRound++;

      document.getElementById("round").textContent =
        `Round ${currentRound} / ${TOTAL_ROUNDS}`;

      document.getElementById("message").textContent =
        "Get ready...";

      document.getElementById("guessArea").style.display = "none";

      const input = document.getElementById("guessInput");
      input.value = "";

      const dotArea = document.getElementById("dotArea");

      dotArea.innerHTML = "";

      /*
        The number of dots gets slightly harder
        as the rounds progress.
      */

      const minDots = 3 + (currentRound - 1) * 2;
      const maxDots = 7 + (currentRound - 1) * 4;

      correctAnswer =
        Math.floor(Math.random() * (maxDots - minDots + 1))
        + minDots;


      // Small pause before the dots appear

      setTimeout(() => {

        showDots(correctAnswer);

        document.getElementById("message").textContent =
          "COUNT!";

        /*
          How long the dots stay visible.
          Lower number = harder.
        */

        const displayTime =
          Math.max(350, 850 - currentRound * 100);

        setTimeout(() => {

          dotArea.innerHTML = "";

          document.getElementById("message").textContent =
            "How many dots were there?";

          document.getElementById("guessArea").style.display =
            "flex";

          acceptingGuess = true;

          document.getElementById("guessInput").focus();

        }, displayTime);

      }, 700);
    }


    function showDots(numberOfDots) {

      const dotArea = document.getElementById("dotArea");

      dotArea.innerHTML = "";

      for (let i = 0; i < numberOfDots; i++) {

        const dot = document.createElement("div");

        dot.className = "dot";

        /*
          Keep dots away from the edges.
        */

        const x = 8 + Math.random() * 84;
        const y = 8 + Math.random() * 84;

        dot.style.left = x + "%";
        dot.style.top = y + "%";

        dotArea.appendChild(dot);
      }
    }


    function submitGuess() {

      if (!acceptingGuess) return;

      const input =
        document.getElementById("guessInput");

      const guess = Number(input.value);

      if (!Number.isInteger(guess) || guess < 1) {
        document.getElementById("message").textContent =
          "Enter a valid number.";

        return;
      }

      acceptingGuess = false;

      if (guess === correctAnswer) {

        score++;

        document.getElementById("message").innerHTML =
          `<span class="correct">
            Correct! There were ${correctAnswer} dots.
          </span>`;

      } else {

        document.getElementById("message").innerHTML =
          `<span class="wrong">
            Wrong! There were ${correctAnswer} dots.
          </span>`;
      }

      document.getElementById("guessArea").style.display =
        "none";


      // Move to the next round after a short pause

      setTimeout(() => {
        nextRound();
      }, 1500);
    }


    function endGame() {

      document.getElementById("gameScreen").style.display =
        "none";

      document.getElementById("result").style.display =
        "block";

      document.getElementById("finalScore").textContent =
        score;

      let message;

      if (score === 5) {
        message = "Perfect! Incredible counting!";
      } else if (score >= 4) {
        message = "Amazing job! Your visual memory is strong.";
      } else if (score >= 3) {
        message = "Nice work! Try again and beat your score.";
      } else if (score >= 1) {
        message = "Good start. Give it another try!";
      } else {
        message = "That was tough! Try again.";
      }

      document.getElementById("resultMessage").textContent =
        message;
    }


    function restartGame() {

      document.getElementById("result").style.display =
        "none";

      document.getElementById("gameScreen").style.display =
        "block";

      document.getElementById("startButton").style.display =
        "inline-block";

      document.getElementById("dotArea").innerHTML = "";

      document.getElementById("round").textContent =
        "Round 0 / 5";

      document.getElementById("message").textContent =
        "Press Start when you're ready.";
    }


    // Press Enter to submit the answer

    document.getElementById("guessInput").addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          submitGuess();
        }

      }
    );

  </script>

</body>
</html>
