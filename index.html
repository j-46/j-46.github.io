<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kwadrat liczby</title>
</head>
<body>

    <h2>Oblicz kwadrat liczby</h2>

    <input type="number" id="liczba">
    <button onclick="oblicz()">Policz</button>

    <p id="wynik"></p>

    <script>
        function oblicz() {
            let x = document.getElementById("liczba").value;
            let kwadrat = x * x;
            document.getElementById("wynik").innerText =
                "Kwadrat liczby to: " + kwadrat;
        }
    </script>

</body>
</html>
