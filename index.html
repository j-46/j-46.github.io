```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #111827;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .stat {
      background: #1f2937;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .stat-number {
      font-size: 32px;
      font-weight: bold;
    }

    .stat-label {
      color: #9ca3af;
      margin-top: 5px;
      font-size: 14px;
    }

    .progress-container {
      background: #1f2937;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #d1d5db;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #374151;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #22c55e;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .add-task {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1f2937;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      outline: 2px solid #3b82f6;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
    }

    .add-button {
      padding: 0 22px;
      background: #3b82f6;
      color: white;
    }

    .add-button:hover {
      background: #2563eb;
    }

    .tasks {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1f2937;
      padding: 15px;
      border-radius: 12px;
      transition: 0.2s;
    }

    .task.completed {
      opacity: 0.6;
    }

    .task.completed .task-text {
      text-decoration: line-through;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #6b7280;
      border-radius: 6px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task.completed .checkbox {
      background: #22c55e;
      border-color: #22c55e;
    }

    .checkbox::after {
      content: "✓";
      color: white;
      font-weight: bold;
      display: none;
    }

    .task.completed .checkbox::after {
      display: block;
    }

    .task-text {
      flex: 1;
      font-size: 16px;
      word-break: break-word;
    }

    .delete {
      background: #ef4444;
      color: white;
      padding: 8px 12px;
    }

    .delete:hover {
      background: #dc2626;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 40px;
      background: #1f2937;
      border-radius: 12px;
    }

    .reset {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #374151;
      color: #d1d5db;
    }

    .reset:hover {
      background: #4b5563;
    }

    @media (max-width: 550px) {
      h1 {
        font-size: 32px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .add-task {
        flex-direction: column;
      }

      .add-button {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Task Tracker</h1>
    <p class="subtitle">Track how much you get done.</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="total">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="completed">0</div>
        <div class="stat-label">Completed</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="remaining">0</div>
        <div class="stat-label">Remaining</div>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-info">
        <span>Progress</span>
        <span id="percentage">0%</span>
      </div>

      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
    </div>

    <div class="add-task">
      <input
        id="taskInput"
        type="text"
        placeholder="What do you need to do?"
      >

      <button class="add-button" onclick="addTask()">
        Add Task
      </button>
    </div>

    <div class="tasks" id="taskList"></div>

    <button class="reset" onclick="resetTasks()">
      Reset All Tasks
    </button>

  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();

      if (text === "") return;

      tasks.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      input.value = "";

      saveTasks();
      renderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => {
        if (task.id === id) {
          return {
            ...task,
            completed: !task.completed
          };
        }

        return task;
      });

      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);

      saveTasks();
      renderTasks();
    }

    function resetTasks() {
      if (!confirm("Are you sure you want to delete all tasks?")) {
        return;
      }

      tasks = [];

      saveTasks();
      renderTasks();
    }

    function renderTasks() {
      const taskList = document.getElementById("taskList");

      const total = tasks.length;
      const completed = tasks.filter(task => task.completed).length;
      const remaining = total - completed;

      const percentage =
        total === 0
          ? 0
          : Math.round((completed / total) * 100);

      document.getElementById("total").textContent = total;
      document.getElementById("completed").textContent = completed;
      document.getElementById("remaining").textContent = remaining;
      document.getElementById("percentage").textContent = percentage + "%";
      document.getElementById("progress").style.width = percentage + "%";

      if (tasks.length === 0) {
        taskList.innerHTML = `
          <div class="empty">
            No tasks yet. Add your first task above!
          </div>
        `;
        return;
      }

      taskList.innerHTML = tasks.map(task => `
        <div class="task ${task.completed ? "completed" : ""}">

          <div
            class="checkbox"
            onclick="toggleTask(${task.id})"
          ></div>

          <div class="task-text">
            ${escapeHTML(task.text)}
          </div>

          <button
            class="delete"
            onclick="deleteTask(${task.id})"
          >
            Delete
          </button>

        </div>
      `).join("");
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("taskInput").addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          addTask();
        }
      }
    );

    renderTasks();
  </script>

</body>
</html>
