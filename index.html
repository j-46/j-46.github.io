<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Guess</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .game {
      width: 90%;
      max-width: 650px;
      text-align: center;
      background: #1e293b;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 42px;
      margin-top: 0;
    }

    .instructions {
      color: #94a3b8;

  </style>
</head>

<body>

  <div class="game">

    <!-- GAME SCREEN -->

    <div id="gameScreen">

      <h1>Dot Guess</h1>

      <p class="instructions">
        Quickly count the dots.<br>
        They'll disappear almost immediately!
      </p>

      <div class="round" id="round">
        Round 0 / 5
      </div>

      <div id="dotArea"></div>

      <div id="message">
        Press Start when you're ready.
      </div>

      <button id="startButton" onclick="startGame()">
        Start Game
      </button>

      <div class="guess-area" id="guessArea">

        <input
          id="guessInput"
          type="number"
          min="1"
          max="10"
          placeholder="1 - 10"
        >

        <button onclick="submitGuess()">
          Guess
        </button>

      </div>

    </div>


    <!-- RESULT SCREEN -->

    <div id="result">

      <h1>Game Over!</h1>

      <p>Your precision:</p>

      <div class="precision">
        <span id="precision">0%</span>
      </div>

      <p>
        Exact guesses:
        <strong id="exactScore">0 / 5</strong>
      </p>

      <div class="round-results" id="roundResults"></div>

      <button onclick="restartGame()">
        Play Again
      </button>

    </div>

  </div>


  <script>

    const TOTAL_ROUNDS = 5;

    let currentRound = 0;
    let correctAnswer = 0;
    let acceptingGuess = false;

    // Stores precision for each round
    let roundPrecisions = [];

    // Stores whether each answer was exactly correct
    let exactGuesses = 0;


    function startGame() {

      currentRound = 0;
      roundPrecisions = [];
      exactGuesses = 0;

      document.getElementById("startButton").style.display = "none";

      nextRound();
    }


    function nextRound() {

      if (currentRound >= TOTAL_ROUNDS) {
        endGame();
        return;
      }

      currentRound++;

      document.getElementById("round").textContent =
        `Round ${currentRound} / ${TOTAL_ROUNDS}`;

      document.getElementById("message").textContent =
        "Get ready...";

      document.getElementById("guessArea").style.display =
        "none";

      document.getElementById("dotArea").innerHTML = "";

      document.getElementById("guessInput").value = "";


      /*
        Every round has between 3 and 10 dots.
      */

      correctAnswer =
        Math.floor(Math.random() * 8) + 3;


      /*
        Very short preparation time.
      */

      setTimeout(() => {

        showDots(correctAnswer);

        document.getElementById("message").textContent =
          "COUNT!";


        /*
          Dots stay visible for:
          
          Round 1: 650 ms
          Round 2: 600 ms
          Round 3: 550 ms
          Round 4: 500 ms
          Round 5: 450 ms
        */

        const displayTime =
          700 - currentRound * 50;


        setTimeout(() => {

          document.getElementById("dotArea").innerHTML = "";

          document.getElementById("message").textContent =
            "How many dots?";

          document.getElementById("guessArea").style.display =
            "flex";

          acceptingGuess = true;

          document.getElementById("guessInput").focus();

        }, displayTime);

      }, 300);
    }


    function showDots(numberOfDots) {

      const dotArea = document.getElementById("dotArea");

      dotArea.innerHTML = "";

      for (let i = 0; i < numberOfDots; i++) {

        const dot = document.createElement("div");

        dot.className = "dot";

        /*
          Keep dots away from the edges.
        */

        const x = 8 + Math.random() * 84;
        const y = 8 + Math.random() * 84;

        dot.style.left = x + "%";
        dot.style.top = y + "%";

        dotArea.appendChild(dot);
      }
    }


    function submitGuess() {

      if (!acceptingGuess) return;

      const input =
        document.getElementById("guessInput");

      const guess = Number(input.value);


      if (
        !Number.isInteger(guess) ||
        guess < 1 ||
        guess > 10
      ) {

        document.getElementById("message").textContent =
          "Enter a number from 1 to 10.";

        return;
      }


      acceptingGuess = false;


      /*
        Calculate precision for this round.

        Example:
        Correct = 10
        Guess = 8

        Precision = 80%
      */

      const precision =
        Math.max(
          0,
          100 - Math.abs(guess - correctAnswer)
                / correctAnswer * 100
        );


      roundPrecisions.push(precision);


      if (guess === correctAnswer) {

        exactGuesses++;

        document.getElementById("message").innerHTML =
          `<span class="correct">
            Perfect! There were ${correctAnswer}.
          </span>`;

      } else {

        document.getElementById("message").innerHTML =
          `<span class="wrong">
            There were ${correctAnswer} dots.
            Your precision: ${Math.round(precision)}%
          </span>`;
      }


      document.getElementById("guessArea").style.display =
        "none";


      /*
        Wait briefly before the next round.
      */

      setTimeout(() => {
        nextRound();
      }, 1000);
    }


    function endGame() {

      document.getElementById("gameScreen").style.display =
        "none";

      document.getElementById("result").style.display =
        "block";


      /*
        Average precision across all 5 rounds.
      */

      const totalPrecision =
        roundPrecisions.reduce(
          (sum, value) => sum + value,
          0
        );

      const averagePrecision =
        totalPrecision / TOTAL_ROUNDS;


      document.getElementById("precision").textContent =
        Math.round(averagePrecision) + "%";


      document.getElementById("exactScore").textContent =
        `${exactGuesses} / ${TOTAL_ROUNDS}`;


      /*
        Show the result of every round.
      */

      const results =
        document.getElementById("roundResults");

      results.innerHTML = "";

      roundPrecisions.forEach((precision, index) => {

        const row = document.createElement("div");

        row.className = "round-result";

        row.innerHTML = `
          <span>Round ${index + 1}</span>
          <strong>${Math.round(precision)}%</strong>
        `;

        results.appendChild(row);
      });
    }


    function restartGame() {

      document.getElementById("result").style.display =
        "none";

      document.getElementById("gameScreen").style.display =
        "block";

      document.getElementById("startButton").style.display =
        "inline-block";

      document.getElementById("dotArea").innerHTML = "";

      document.getElementById("round").textContent =
        "Round 0 / 5";

      document.getElementById("message").textContent =
        "Press Start when you're ready.";
    }


    /*
      Press Enter to submit the guess.
    */

    document.getElementById("guessInput").addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          submitGuess();
        }

      }
    );

  </script>

</body>
</html>
