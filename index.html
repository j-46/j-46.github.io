```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Guess</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .game {
      width: 90%;
      max-width: 650px;
      text-align: center;
      background: #1e293b;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    /* =========================
       HOME SCREEN
    ========================= */

    #homeScreen h1 {
      font-size: 55px;
      margin: 10px 0;
    }

    .logo {
      font-size: 75px;
      margin-bottom: 10px;
    }

    .home-description {
      color: #94a3b8;
      font-size: 18px;
      line-height: 1.6;
      margin: 20px auto 35px;
      max-width: 450px;
    }

    .play-button {
      font-size: 22px;
      padding: 17px 55px;
    }


    /* =========================
       GAME SCREEN
    ========================= */

    #gameScreen {
      display: none;
    }

    h1 {
      font-size: 42px;
      margin-top: 0;
    }

    .instructions {
      color: #94a3b8;
      line-height: 1.5;
    }

    .round {
      font-size: 18px;
      color: #60a5fa;
      font-weight: bold;
      margin: 20px 0;
    }

    #dotArea {
      width: 100%;
      height: 300px;
      background: #0f172a;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
      margin: 15px 0;
    }

    .dot {
      position: absolute;
      width: 19px;
      height: 19px;
      background: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
    }

    #message {
      font-size: 21px;
      min-height: 30px;
      margin: 15px 0;
    }

    .guess-area {
      display: none;
      gap: 10px;
      justify-content: center;
    }

    input {
      width: 150px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    input:focus {
      outline: 2px solid #3b82f6;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 25px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      transition: 0.15s;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }


    /* =========================
       RESULT SCREEN
    ========================= */

    #result {
      display: none;
    }

    .result-icon {
      font-size: 65px;
    }

    .precision {
      font-size: 65px;
      font-weight: bold;
      color: #22c55e;
      margin: 15px;
    }

    .exact {
      color: #cbd5e1;
      font-size: 18px;

    .round-results {
      margin: 25px 0;
      text-align: left;
    }

    .round-result {
      display: flex;
      justify-content: space-between;
      padding: 10px 15px;
      margin: 6px 0;
      background: #0f172a;
      border-radius: 8px;
      color: #cbd5e1;
    }

    .result-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 25px;
    }

    .home-button {
      background: #475569;
    }

    .home-button:hover {
      background: #334155;
    }

    .correct {
      color: #22c55e;
    }

    .wrong {
      color: #ef4444;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 550px) {

      .game {
        padding: 25px;
      }

      #homeScreen h1 {
        font-size: 42px;
      }

      .logo {
        font-size: 60px;
      }

      .result-buttons {

      }

  </style>
</head>


<body>

  <div class="game">


    <!-- =========================
         HOME SCREEN
    ========================= -->

    <div id="homeScreen">

      <div class="logo">● ● ●</div>

      <h1>Dot Guess</h1>

      <p class="home-description">
        How good is your visual counting?
        <br><br>
        You'll see a group of dots for a
        split second. Count them and try
        to guess the exact number.
      </p>

      <button
        class="play-button"
        onclick="startGame()"
      >
        ▶ Play
      </button>

    </div>


    <!-- =========================
         GAME SCREEN
    ========================= -->

    <div id="gameScreen">

      <h1>Dot Guess</h1>

      <div class="round" id="round">
        Round 1 / 5
      </div>

      <div id="dotArea"></div>

      <div id="message">
        Get ready...
      </div>

      <div class="guess-area" id="guessArea">

        <input
          id="guessInput"
          type="number"
          min="1"
          max="10"
          placeholder="1 - 10"
          autocomplete="off"
        >

        <button onclick="submitGuess()">
          Guess
        </button>

      </div>

    </div>


    <!-- =========================
         RESULT SCREEN
    ========================= -->

    <div id="result">

      <div class="result-icon">
        🧠
      </div>

      <h1>Game Complete!</h1>

      <p>Your precision:</p>

      <div class="precision">
        <span id="precision">0%</span>
      </div>

      <p class="exact">
        Exact guesses:
        <strong id="exactScore">0 / 5</strong>
      </p>

      <div
        class="round-results"
        id="roundResults"
      ></div>

      <div class="result-buttons">

        <button onclick="startGame()">
          Play Again
        </button>

        <button
          class="home-button"
          onclick="goHome()"
        >
          Exit to Home
        </button>

      </div>

    </div>

  </div>


  <script>

    /*
      =========================
      GAME SETTINGS
      =========================
    */

    const TOTAL_ROUNDS = 5;

    // Minimum and maximum number of dots
    const MIN_DOTS = 3;
    const MAX_DOTS = 10;


    /*
      =========================
      GAME VARIABLES
      =========================
    */

    let currentRound = 0;
    let correctAnswer = 0;
    let acceptingGuess = false;

    let roundPrecisions = [];
    let exactGuesses = 0;


    /*
      =========================
      START GAME
      =========================
    */

    function startGame() {

      currentRound = 0;
      roundPrecisions = [];
      exactGuesses = 0;

      document.getElementById("homeScreen").style.display =
        "none";

      document.getElementById("result").style.display =
        "none";

      document.getElementById("gameScreen").style.display =
        "block";

      nextRound();
    }


    /*
      =========================
      NEXT ROUND
      =========================
    */

    function nextRound() {

      if (currentRound >= TOTAL_ROUNDS) {
        endGame();
        return;
      }

      currentRound++;

      document.getElementById("round").textContent =
        `Round ${currentRound} / ${TOTAL_ROUNDS}`;

      document.getElementById("message").textContent =
        "Get ready...";

      document.getElementById("guessArea").style.display =
        "none";

      document.getElementById("dotArea").innerHTML = "";

      document.getElementById("guessInput").value = "";


      /*
        Generate 3–10 dots.
      */

      correctAnswer =
        Math.floor(
          Math.random() *
          (MAX_DOTS - MIN_DOTS + 1)
        ) + MIN_DOTS;


      /*
        Only 150ms preparation time.
      */

      setTimeout(() => {

        showDots(correctAnswer);

        document.getElementById("message").textContent =
          "COUNT!";


        /*
          Dots are shown VERY briefly.

          Round 1 = 450ms
          Round 2 = 400ms
          Round 3 = 350ms
          Round 4 = 300ms
          Round 5 = 250ms
        */

        const displayTime =
          500 - currentRound * 50;


        setTimeout(() => {

          document.getElementById("dotArea").innerHTML =
            "";

          document.getElementById("message").textContent =
            "How many?";

          document.getElementById("guessArea").style.display =
            "flex";

          acceptingGuess = true;

          document.getElementById("guessInput").focus();

        }, displayTime);

      }, 150);
    }


    /*
      =========================
      SHOW DOTS
      =========================
    */

    function showDots(numberOfDots) {

      const dotArea =
        document.getElementById("dotArea");

      dotArea.innerHTML = "";

      for (let i = 0; i < numberOfDots; i++) {

        const dot =
          document.createElement("div");

        dot.className = "dot";


        /*
          Random position.
        */

        const x =
          8 + Math.random() * 84;

        const y =
          8 + Math.random() * 84;

        dot.style.left = x + "%";
        dot.style.top = y + "%";

        dotArea.appendChild(dot);
      }
    }


    /*
      =========================
      SUBMIT GUESS
      =========================
    */

    function submitGuess() {

      if (!acceptingGuess) return;

      const input =
        document.getElementById("guessInput");

      const guess = Number(input.value);


      /*
        Validate input.
      */

      if (
        !Number.isInteger(guess) ||
        guess < MIN_DOTS ||
        guess > MAX_DOTS
      ) {

        document.getElementById("message").textContent =
          `Enter a number from ${MIN_DOTS} to ${MAX_DOTS}.`;

        return;
      }


      acceptingGuess = false;


      /*
        Calculate precision.

        Example:

        Actual = 8
        Guess  = 7

        Precision = 87.5%
      */

      const precision =
        Math.max(
          0,
          100 -
          Math.abs(guess - correctAnswer)
          / correctAnswer
          * 100
        );


      roundPrecisions.push(precision);


      if (guess === correctAnswer) {

        exactGuesses++;

        document.getElementById("message").innerHTML =
          `<span class="correct">
            ✓ Correct! It was ${correctAnswer}.
          </span>`;

      } else {

        document.getElementById("message").innerHTML =
          `<span class="wrong">
            ✕ It was ${correctAnswer}.
            You were ${Math.round(precision)}% accurate.
          </span>`;
      }


      document.getElementById("guessArea").style.display =
        "none";


      /*
        Only 500ms between rounds.
      */

      setTimeout(() => {
        nextRound();
      }, 500);
    }


    /*
      =========================
      END GAME
      =========================
    */

    function endGame() {

      document.getElementById("gameScreen").style.display =
        "none";

      document.getElementById("result").style.display =
        "block";


      /*
        Calculate average precision.
      */

      const totalPrecision =
        roundPrecisions.reduce(
          (sum, value) => sum + value,
          0
        );

      const averagePrecision =
        totalPrecision / TOTAL_ROUNDS;


      document.getElementById("precision").textContent =
        Math.round(averagePrecision) + "%";


      document.getElementById("exactScore").textContent =
        `${exactGuesses} / ${TOTAL_ROUNDS}`;


      /*
        Display every round.
      */

      const results =
        document.getElementById("roundResults");

      results.innerHTML = "";


      roundPrecisions.forEach(
        (precision, index) => {

          const row =
            document.createElement("div");

          row.className = "round-result";

          row.innerHTML = `
            <span>Round ${index + 1}</span>
            <strong>${Math.round(precision)}%</strong>
          `;

          results.appendChild(row);
        }
      );
    }


    /*
      =========================
      GO HOME
      =========================
    */

    function goHome() {

      document.getElementById("result").style.display =
        "none";

      document.getElementById("gameScreen").style.display =
        "none";

      document.getElementById("homeScreen").style.display =
        "block";

      document.getElementById("dotArea").innerHTML =
        "";

      acceptingGuess = false;
    }


    /*
      =========================
      ENTER KEY
      =========================
    */

    document.getElementById("guessInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            submitGuess();
          }

        }
      );

  </script>

</body>
</html>
